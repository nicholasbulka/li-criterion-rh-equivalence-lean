# ---------------------------------------------------------------------------
# Limitations and remaining gaps, stated so a reader can calibrate the claim.
#
# SUBMISSION GATE: cleared. The two declarations named in `comparator.json`,
# `li_criterion` and `li_coefficients_eq_zero_sum`, both report exactly
# propext, Classical.choice, Quot.sound.
# ---------------------------------------------------------------------------
known_gaps: []

limitations:
  - >-
    Classically known result (Li 1997). The first formal statement is the
    equivalence RH <-> Li positivity; it is not a proof of the Riemann
    Hypothesis, nor of the positivity of the coefficients. The second formal
    statement identifies the Taylor coefficients with the symmetrically summed
    arithmetic coefficients over the nontrivial zeros.
  - >-
    The genus-1 Hadamard factorization of xi (with multiplicity) and the
    genus-1 summability of 1/||rho||^2, and the growth bound order(xi) <= 1 are
    all PROVED in the development and folded into the biconditional; none of
    them is an assumption. The order bound is proved in
    Lc/LiCriterion/XiGrowth.lean from the Mellin representation of
    completedRiemannZeta0 and the exponential decay of the theta kernel, so no
    polynomial bound for zeta in the critical strip is needed.
  - >-
    The compared theorems `li_criterion` and
    `li_coefficients_eq_zero_sum` depend on propext, Classical.choice and
    Quot.sound only. `Challenge.lean` states the results but does not prove
    them; that is the comparator convention, and `Solution.lean` supplies the
    proofs by delegating to the library.
