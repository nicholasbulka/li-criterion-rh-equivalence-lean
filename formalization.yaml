# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Li's criterion for the Riemann Hypothesis"
  description: >-
    Li's criterion for the Riemann zeta function, formalized in Lean 4 over Mathlib:
    Mathlib's `RiemannHypothesis` holds if and only if every Li-Keiper coefficient of the
    completed xi function has nonnegative real part. The zero-indexed analytic coefficient
    at n is Li's classical lambda_(n+1), the n-th Taylor coefficient at 0 of the logarithmic
    derivative of s |-> xi(1/(1-s)). A second compared theorem identifies this analytic
    coefficient with Li's arithmetic coefficient, the symmetrized sum over the nontrivial
    zeros counted with multiplicity, and proves that symmetrized family summable so the sum
    is the genuine one. Both results are unconditional: the biconditional,
    the coefficient identification, the genus-1 Hadamard factorization of xi (with
    multiplicity), genus-1 summability of 1/|rho|^2, and the growth bound order(xi) <= 1
    are all proved. This is a formalization of a classically known equivalence
    (X.-J. Li, 1997); it is not a proof of the Riemann Hypothesis, nor of the positivity
    of the coefficients.
  authors:
    - "Nicholas Bulka"
  responsible_maintainers:
    - "Nicholas Bulka"
  license: "Apache-2.0"

repository:
  role: substantive-development

# Mathematical sources. This is a source-based formalization of a classically known result.
sources:
  - title: "The positivity of a sequence of numbers and the Riemann hypothesis"
    authors: ["Xian-Jin Li"]
    type: "paper"
    id: "J. Number Theory 65 (1997), 325-333; doi:10.1006/jnth.1997.2137"
    relationship: formalizes
    note: >-
      The criterion being formalized: the Riemann Hypothesis is equivalent to the
      nonnegativity of the sequence (lambda_n). The Challenge statement is this
      equivalence, with classical lambda_(n+1) realized as the n-th Taylor coefficient of
      the logarithmic derivative of xi under the Cayley map z |-> 1/(1-z).

  - title: "Complements to Li's criterion for the Riemann hypothesis"
    authors: ["Enrico Bombieri", "Jeffrey C. Lagarias"]
    type: "paper"
    id: "J. Number Theory 77 (1999), 274-287; doi:10.1006/jnth.1999.2392"
    relationship: adapts
    note: >-
      The second compared theorem, `li_coefficients_eq_zero_sum`, is the arithmetic
      (sum-over-zeros) form of the coefficients from this paper, adapted as follows: the sum
      is taken in the symmetric sense that pairs rho with 1 - rho, multiplicity is Mathlib's
      `analyticOrderNatAt`, and the theorem also proves the symmetrized family is summable.
      The paper's account of the equivalence also fixed the statement of record for the
      first theorem.

  - title: "Power series expansions of Riemann's xi function"
    authors: ["Jerry B. Keiper"]
    type: "paper"
    id: "Math. Comp. 58 (1992), 765-773; doi:10.2307/2153215"
    relationship: background
    note: >-
      The Keiper coefficients, of which the Li coefficients are the Cayley-map realization
      used here.

  - title: "Lectures on Probability Theory - Li Criterion"
    authors: ["M. Ram Murty"]
    type: "other"
    id: "https://www.youtube.com/watch?v=M0lgrrskxMw"
    relationship: background
    note: >-
      An explanatory lecture on Li's criterion that helped guide the maintainer's
      understanding of the mathematics and its presentation.

  - title: "Mathlib (completed Riemann zeta and RiemannHypothesis)"
    authors: ["The mathlib community"]
    type: "other"
    id: "https://github.com/leanprover-community/mathlib4"
    relationship: background
    note: >-
      Software dependency, not a mathematical source. The RH side of the biconditional is
      Mathlib's `RiemannHypothesis`; the xi function is built from Mathlib's
      `completedRiemannZeta0`. `rh_equiv_mathlib` bridges Mathlib's predicate to the
      critical-strip form used internally.

related_formalizations: []

