  arxiv: [math.NT]
  msc2020: ["11M26", "11M06", "30D15"]

status:
  scope: >-
    Complete. Li's criterion for the Riemann zeta function as an unconditional
    biconditional against Mathlib's `RiemannHypothesis`, plus the identification of the
    analytic Taylor coefficients with Li's arithmetic coefficients (symmetrized sum over
    nontrivial zeros with multiplicity). The supporting theory - genus-1 Hadamard
    factorization of xi with multiplicity, genus-1 summability, and the order bound
    order(xi) <= 1 - is proved in the development, not assumed. The order bound is proved
    in Lc/LiCriterion/XiGrowth.lean from the Mellin representation of
    completedRiemannZeta0 and the exponential decay of the theta kernel, so no polynomial
    bound for zeta in the critical strip is needed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "li_criterion"
      file: "comparator/Solution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "li_coefficients_eq_zero_sum"
      file: "comparator/Solution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      notes: >-
        Wrote essentially all of the Lean source in the LiCriterion development, working
        interactively under the direction and review of the maintainer: choosing the Lean
        formulations, finding and repairing proofs, and building the
        Hadamard-factorization and Li-criterion machinery. The maintainer set the targets
        and reviewed the output.
  notes: >-
    Interactive agent-assisted development directed and reviewed by the maintainer.

fidelity:
  divergences: >-
    The compared statements are faithful to Li (1997) and Bombieri-Lagarias (1999) with the
    following choices of formulation. Li's lambda_n is indexed classically from 1; the
    formal `taylorCoeff riemannXi n` is zero-indexed, so it is lambda_(n+1). The
    arithmetic coefficient is stated as the symmetrized sum over nontrivial zeros counted
    with multiplicity, which is the classical symmetric summation convention; the
    corresponding unpaired family is not absolutely summable. The second compared theorem
    is a conjunction: `Summable` of the symmetrized weighted family, and the equality of
    the Taylor coefficient with half its `tsum`, so the sum cannot be Lean's default value. `Challenge.lean` states the
    results with deliberate `sorry` holes, as the Comparator convention requires, and
    `Solution.lean` supplies the proofs by delegating to the library. The Challenge
    definitions (`riemannXi`, `phi`, `logDeriv`, `taylorCoeff`, `NontrivialZero`) are
    built directly from Mathlib and mirrored character-for-character in
    `ChallengeDeps.lean`. No additional hypotheses are assumed; the compared theorems
    depend on propext, Classical.choice and Quot.sound only.

review:
  status: self-assessed
  reviewers: ["Nicholas Bulka"]
  notes: >-
    The maintainer directed and reviewed the development as it was produced. No external
    or independent review has been performed. Every step is checked by Lean; the
    comparator re-checks the statement equality, the axiom allowlist, and the kernel
    replay.

alignment:
  namespace: "LiCriterion"
  statements:
    - source: "Li (1997), Theorem 1: RH iff lambda_n >= 0 for all n >= 1"
      lean: "li_criterion"
      module: "comparator/Solution.lean (proof: LiCriterion.li_criterion_rh_iff, Lc/LiCriterion/XiOrderBridge.lean)"
      status: proved
      note: "Stated against Mathlib's RiemannHypothesis; lambda_(n+1) as taylorCoeff riemannXi n."
    - source: "Bombieri-Lagarias (1999), arithmetic form lambda_n = sum over rho of (1 - (1 - 1/rho)^n)"
      lean: "li_coefficients_eq_zero_sum"
      module: "comparator/Solution.lean (proof: LiCriterion.summable_li_symmetrized and LiCriterion.taylorCoeff_eq_li_symmetrized, Lc/LiCriterion/Fidelity.lean)"
      status: proved
      note: "Summability of the symmetrized family, and the symmetrized sum over nontrivial zeros with multiplicity."
    - source: "Hadamard factorization of xi, genus 1 (Titchmarsh; Conway Ch. XI)"
      lean: "Hadamard.* and Lc/LiCriterion/GenusOnePairedSumFormula.lean"
      module: "Hadamard/, Lc/LiCriterion/"
      status: proved
    - source: "order(xi) <= 1"
      lean: "LiCriterion.xi_order_le_one, LiCriterion.xi_hasFiniteOrder"
      module: "Lc/LiCriterion/XiGrowth.lean"
      status: proved

acknowledgements: >-
  Mathlib (completedRiemannZeta0, RiemannHypothesis). Layout follows the Palomar comparator
