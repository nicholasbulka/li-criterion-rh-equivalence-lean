version: "0.3"

project:
  name: "Li's criterion for the Riemann Hypothesis"
  authors:
    - name: "Nicholas Bulka"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Nicholas Bulka"

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11M26", "11M06", "30D15"]

status: complete
fidelity: faithful
scope: >-
  Li's criterion for the Riemann zeta function: mathlib's `RiemannHypothesis`
  holds if and only if every Li-Keiper coefficient of the completed xi has
  nonnegative real part, where the zero-indexed analytic coefficient at n is
  Li's classical lambda_(n+1): the n-th Taylor coefficient at 0 of the
  logarithmic derivative of s |-> xi(1/(1-s)). The
  second compared theorem identifies this analytic coefficient with Li's
  arithmetic coefficient, expressed as the symmetrized sum over nontrivial
  zeros with multiplicity. The results are unconditional: the biconditional,
  coefficient identification, genus-1 Hadamard factorization of xi (with
  multiplicity), genus-1 summability, and growth bound giving order(xi) <= 1
  are all proved.

# ---------------------------------------------------------------------------
# Mathematical sources.
#
# This is a source-based formalization of a classically known result.
# ---------------------------------------------------------------------------
sources:
  - title: "The positivity of a sequence of numbers and the Riemann hypothesis"
    authors: ["Xian-Jin Li"]
    type: "paper"
    identifier: "J. Number Theory 65 (1997), 325-333; doi:10.1006/jnth.1997.2137"
    relationship: formalizes
    note: >-
      The criterion being formalized: the Riemann Hypothesis is equivalent to
      the nonnegativity of the sequence (lambda_n). The Challenge statement is
      this equivalence, with classical lambda_(n+1) realized as the n-th Taylor
      coefficient of the logarithmic derivative of xi under the Cayley map
      z |-> 1/(1-z).

  - title: "Complements to Li's criterion for the Riemann hypothesis"
    authors: ["Enrico Bombieri", "Jeffrey C. Lagarias"]
    type: "paper"
    identifier: "J. Number Theory 77 (1999), 274-287; doi:10.1006/jnth.1999.2392"
    relationship: background
    note: >-
      The arithmetic (sum-over-zeros) form of the coefficients and the standard
      account of the equivalence used to fix the statement of record.

  - title: "Power series expansions of Riemann's xi function"
    authors: ["Jerry B. Keiper"]
    type: "paper"
    identifier: "Math. Comp. 58 (1992), 765-773; doi:10.2307/2153215"
    relationship: background
    note: >-
      The Keiper coefficients, of which the Li coefficients are the Cayley-map
      realization used here.

  - title: "Lectures on Probability Theory - Li Criterion"
    authors: ["M. Ram Murty"]
    type: "other"
    identifier: "https://www.youtube.com/watch?v=M0lgrrskxMw"
    relationship: background
    note: >-
      An explanatory lecture on Li's criterion that helped guide the
      maintainer's understanding of the mathematics and its presentation.

  - title: "Mathlib (completed Riemann zeta and RiemannHypothesis)"
    authors: ["The mathlib community"]
    type: "software"
    identifier: "https://github.com/leanprover-community/mathlib4"
    relationship: uses
    note: >-
      The RH side of the biconditional is mathlib's `RiemannHypothesis`; the xi
      function is built from mathlib's `completedRiemannZeta0`. `rh_equiv_mathlib`
      bridges mathlib's predicate to the critical-strip form used internally.

related_formalizations: []

